[package]
name = "sortlab"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "An experimental, extensible Rust library of sorting algorithms with a unified API."
repository = "https://github.com/ApTx2012/sortlab"
categories = ["algorithms"]
keywords = ["sorting", "algorithm", "sorter", "iterator"]

[features]
default = ["alloc"]
# Parallel sorting support (std::thread based).
parallel = ["alloc"]
# Enables algorithms that need dynamic allocation (merge sort scratch buffer).
alloc = []

[dependencies]
# no deps for now

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "sorting"
harness = false
